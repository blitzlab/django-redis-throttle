name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: py${{ matrix.python }} / Django ${{ matrix.django }} / Redis ${{ matrix.redis }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.10", django: "5.2", redis: "6.2" }
          - { python: "3.12", django: "5.2", redis: "7" }
          - { python: "3.13", django: "6.0", redis: "7" }
          - { python: "3.14", django: "6.0", redis: "7" }
          - { python: "3.13", django: "6.1", redis: "7" }
          - { python: "3.14", django: "6.1", redis: "7" }
    services:
      redis:
        image: redis:${{ matrix.redis }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install
        run: |
          pip install "Django~=${{ matrix.django }}.0" -e . pytest pytest-django djangorestframework
      - name: Tests
        env:
          REDIS_URL: redis://localhost:6379/15
        run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
